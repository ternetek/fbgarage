<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#090807" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Menú — FB Garage"
    />
    <title>FB Garage — Menú</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow+Condensed:ital,wght@0,400;0,500;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="garage-theme" data-menu-json="menu/menu.json">
    <div class="noise" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <header class="masthead">
      <div class="masthead-strip" aria-hidden="true"></div>
      <div class="masthead-inner">
        <p class="tagline">Roadhouse · Bar &amp; grill</p>
        <h1 class="logo">
          <span class="logo-small">Club house —</span>
          <span class="logo-main">F&amp;B Garage</span>
        </h1>
        <p class="lead">Menú clásico sobre ruedas. Barras, humo parrillero y buena honda.</p>
      </div>
    </header>

    <div class="nav-rail">
      <nav class="anchor-nav" aria-label="Ir a categoría"></nav>
    </div>

    <main id="menu-principal" class="menu-layout">
      <h2 class="visually-hidden">Menú</h2>
      <div id="menu-root" class="menu-board"></div>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <p>Fuente de datos: <code class="footer-code">menu/menu.json</code></p>
        <p class="footer-note">
          Todos los derechos reservados.
        </p>
      </div>
    </footer>

    <script src="js/app.js" defer></script>
  </body>
</html>
